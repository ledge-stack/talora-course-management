version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: talora
      POSTGRES_PASSWORD: talora
      POSTGRES_DB: talora
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://talora:talora@db:5432/talora
      PORT: 5000
    ports:
      - '5000:5000'
    depends_on:
      - db

volumes:
  db-data:
