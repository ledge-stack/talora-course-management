version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: talora-postgres
    environment:
      POSTGRES_USER: talora
      POSTGRES_PASSWORD: talorapassword
      POSTGRES_DB: taloradb
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: talora-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: talora-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
