name: CI — Checks & Validation

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs on the same branch/PR when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Type-check all TypeScript packages
  # ─────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate -w packages/database

      - name: TypeScript — packages/domain
        run: npx tsc --noEmit -p packages/domain/tsconfig.json

      - name: TypeScript — packages/auth
        run: npx tsc --noEmit -p packages/auth/tsconfig.json

      - name: TypeScript — packages/observability
        run: npx tsc --noEmit -p packages/observability/tsconfig.json

      - name: TypeScript — packages/contracts
        run: npx tsc --noEmit -p packages/contracts/tsconfig.json

      - name: TypeScript — apps/worker
        run: npx tsc --noEmit -p apps/worker/tsconfig.json

  # ─────────────────────────────────────────────
  # JOB 2: Lint all TypeScript/TSX source files
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint across monorepo
        run: npm run lint

  # ─────────────────────────────────────────────
  # JOB 3: Unit tests with coverage
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate -w packages/database

      - name: Run Unit Tests (packages/domain)
        run: npm test -w packages/domain -- --coverage --coverageReporters=text-summary

      - name: Run Unit Tests (all workspaces)
        run: npm test --workspaces --if-present

  # ─────────────────────────────────────────────
  # JOB 4: Database schema validation
  # ─────────────────────────────────────────────
  validate-db-schema:
    name: Validate Database Schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talora
          POSTGRES_PASSWORD: talorapassword
          POSTGRES_DB: taloradb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://talora:talorapassword@localhost:5432/taloradb
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema (parse + generate)
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Generate Prisma Client
        run: npm run prisma:generate -w packages/database

      - name: Run Migrations (deploy)
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  # ─────────────────────────────────────────────
  # JOB 5: Build all apps and packages
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate -w packages/database

      - name: Build all workspaces
        run: npm run build

  # ─────────────────────────────────────────────
  # JOB 6: PR-only checks (title, size, labels)
  # ─────────────────────────────────────────────
  pr-checks:
    name: PR Hygiene Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify PR Title Follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR Title: $PR_TITLE"
          if echo "$PR_TITLE" | grep -qE '^(feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert)(\(.+\))?: .{1,72}$'; then
            echo "✅ PR title matches conventional commit format"
          else
            echo "❌ PR title must follow conventional commits: type(scope): description"
            echo "   Examples: feat(auth): add JWT refresh endpoint"
            echo "             fix(domain): correct year prefix validation regex"
            exit 1
          fi

      - name: Check PR Is Not a Draft
        if: github.event.pull_request.draft == true
        run: |
          echo "⚠️  This PR is still a draft. Merge checks are informational only."
